name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The project file uses Xcode's newest "synchronized folder" format
      # (objectVersion 77), which only recent Xcode versions can open —
      # older ones fail with "future Xcode project file format". Pick the
      # newest Xcode the runner has installed rather than trusting whatever
      # default `xcodebuild` resolves to.
      - name: Select newest available Xcode
        run: |
          ls /Applications | grep '^Xcode.*\.app$'
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Build Release (ad-hoc signed)
        run: |
          xcodebuild -project NapLocker.xcodeproj -scheme NapLocker \
            -configuration Release -derivedDataPath build clean build \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM=""

      - name: Zip app bundle
        run: |
          ditto -c -k --keepParent \
            build/Build/Products/Release/NapLocker.app \
            NapLocker.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NapLocker
          path: NapLocker.zip

      # Only a tag push (e.g. `git tag v1.1.0 && git push --tags`) publishes a
      # release; workflow_dispatch runs just build + upload the artifact
      # above, for testing the build without cutting a release.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" NapLocker.zip \
            --title "NapLocker ${{ github.ref_name }}" \
            --notes "Automated build from ${{ github.sha }}. Ad-hoc signed, not notarized."

      # Keep the Homebrew cask SHA/version in lockstep with the GitHub Release
      # zip. The public tap (nileshkk9/homebrew-naplocker) syncs from this file.
      - name: Bump Homebrew cask
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          SHA256=$(shasum -a 256 NapLocker.zip | awk '{print $1}')
          CASK=Casks/naplocker.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main

          perl -i -pe "s/^  version \".*\"/  version \"${VERSION}\"/" "$CASK"
          perl -i -pe "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" "$CASK"

          git add "$CASK"
          if git diff --staged --quiet; then
            echo "Cask already at ${VERSION}"
            exit 0
          fi
          git commit -m "chore: bump Homebrew cask to ${VERSION}"
          git push origin main
